<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
    <marker id="arrowhead-left" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Without Sessions</text>

  <!-- Client box -->
  <rect x="40" y="60" width="100" height="40" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Client</text>

  <!-- Raft Cluster box -->
  <rect x="400" y="60" width="150" height="40" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="475" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Raft Cluster</text>

  <!-- Vertical lines -->
  <line x1="90" y1="100" x2="90" y2="290" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="475" y1="100" x2="475" y2="290" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Step 1: First proposal -->
  <line x1="95" y1="130" x2="465" y2="130" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead-gray)"/>
  <text x="280" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Propose("transfer $100")</text>

  <!-- Applied label -->
  <text x="550" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">✓ Applied</text>

  <!-- Step 2: Network timeout -->
  <line x1="465" y1="170" x2="95" y2="170" stroke="#e74c3c" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="280" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">(network timeout)</text>
  <text x="140" y="185" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">?</text>

  <!-- Step 3: Retry -->
  <line x1="95" y1="210" x2="465" y2="210" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead-gray)"/>
  <text x="280" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Retry("transfer $100")</text>

  <!-- Applied AGAIN - Error -->
  <rect x="490" y="220" width="100" height="40" rx="3" fill="#fee2e2" stroke="#e74c3c" stroke-width="1"/>
  <text x="540" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">✗ Applied AGAIN!</text>
  <text x="540" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">(double transfer!)</text>

  <!-- Step 4: OK response -->
  <line x1="465" y1="280" x2="95" y2="280" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead-left)"/>
  <text x="280" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">OK</text>
</svg>
