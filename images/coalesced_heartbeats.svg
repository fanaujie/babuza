<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Without Coalescing Section -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="370" height="220" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
    <text x="205" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">Without Coalescing</text>
  </g>

  <!-- Store box (left side - without) -->
  <rect x="40" y="70" width="100" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text x="90" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Store</text>
  <text x="90" y="115" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(100 Raft</text>
  <text x="90" y="128" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">groups)</text>

  <!-- Remote Store box (right side - without) -->
  <rect x="270" y="70" width="100" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text x="320" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Remote</text>
  <text x="320" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Store</text>

  <!-- Multiple arrows (without coalescing) -->
  <line x1="140" y1="100" x2="268" y2="100" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="140" y1="120" x2="268" y2="120" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="140" y1="140" x2="268" y2="140" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="205" y="162" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">...</text>
  <line x1="140" y1="175" x2="268" y2="175" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="140" y1="195" x2="268" y2="195" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Label for arrows -->
  <text x="205" y="225" font-family="Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle">100 network round trips</text>

  <!-- With Coalescing Section -->
  <g filter="url(#shadow)">
    <rect x="410" y="20" width="370" height="220" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="595" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">With Coalescing</text>
  </g>

  <!-- Store box (left side - with) -->
  <rect x="430" y="70" width="100" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text x="480" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Store</text>
  <text x="480" y="115" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(100 Raft</text>
  <text x="480" y="128" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">groups)</text>

  <!-- Remote Store box (right side - with) -->
  <rect x="660" y="70" width="100" height="140" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text x="710" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Remote</text>
  <text x="710" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Store</text>

  <!-- Single coalesced arrow -->
  <line x1="530" y1="140" x2="658" y2="140" stroke="#16a34a" stroke-width="4" marker-end="url(#arrowhead-green)" />

  <!-- Coalesced message box -->
  <rect x="555" y="100" width="70" height="30" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
  <text x="590" y="118" font-family="Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">[1,2,3...100]</text>

  <!-- Label for arrow -->
  <text x="595" y="225" font-family="Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">1 network round trip!</text>

  <!-- Comparison Section -->
  <g filter="url(#shadow)">
    <rect x="20" y="260" width="760" height="220" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="400" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">How Coalesced Heartbeats Work</text>
  </g>

  <!-- Step 1 -->
  <rect x="40" y="310" width="150" height="80" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" />
  <text x="115" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1565c0" text-anchor="middle">1. Collect</text>
  <text x="115" y="355" font-family="Arial, sans-serif" font-size="10" fill="#1976d2" text-anchor="middle">Heartbeats from</text>
  <text x="115" y="370" font-family="Arial, sans-serif" font-size="10" fill="#1976d2" text-anchor="middle">multiple groups</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="350" x2="220" y2="350" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Step 2 -->
  <rect x="230" y="310" width="150" height="80" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1" />
  <text x="305" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e65100" text-anchor="middle">2. Batch</text>
  <text x="305" y="355" font-family="Arial, sans-serif" font-size="10" fill="#fb8c00" text-anchor="middle">Group by destination</text>
  <text x="305" y="370" font-family="Arial, sans-serif" font-size="10" fill="#fb8c00" text-anchor="middle">peer</text>

  <!-- Arrow 2 -->
  <line x1="380" y1="350" x2="410" y2="350" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Step 3 -->
  <rect x="420" y="310" width="150" height="80" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1" />
  <text x="495" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">3. Send</text>
  <text x="495" y="355" font-family="Arial, sans-serif" font-size="10" fill="#43a047" text-anchor="middle">Single merged</text>
  <text x="495" y="370" font-family="Arial, sans-serif" font-size="10" fill="#43a047" text-anchor="middle">network message</text>

  <!-- Arrow 3 -->
  <line x1="570" y1="350" x2="600" y2="350" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Step 4 -->
  <rect x="610" y="310" width="150" height="80" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1" />
  <text x="685" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7b1fa2" text-anchor="middle">4. Receive</text>
  <text x="685" y="355" font-family="Arial, sans-serif" font-size="10" fill="#9c27b0" text-anchor="middle">Split and dispatch</text>
  <text x="685" y="370" font-family="Arial, sans-serif" font-size="10" fill="#9c27b0" text-anchor="middle">to groups</text>

  <!-- Benefits -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Benefits: Reduced network overhead, lower latency, better scalability for many Raft groups</text>

  <!-- Config hint -->
  <text x="400" y="455" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Config: CoalescedHeartbeatTickMs (default: 50ms) | CoalescedHeartbeatQueueSize (default: 512)</text>
</svg>
