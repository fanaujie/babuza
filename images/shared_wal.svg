<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <!-- Without Shared WAL Section -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="370" height="210" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
    <text x="205" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b" text-anchor="middle">Without Shared WAL</text>
  </g>

  <!-- Group boxes (without shared WAL) -->
  <rect x="40" y="60" width="90" height="70" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" />
  <text x="85" y="85" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1565c0" text-anchor="middle">Group 1</text>
  <rect x="55" y="100" width="60" height="22" rx="4" fill="#ffffff" stroke="#1976d2" stroke-width="1" />
  <text x="85" y="115" font-family="Arial, sans-serif" font-size="9" fill="#1976d2" text-anchor="middle">WAL</text>

  <rect x="155" y="60" width="90" height="70" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1" />
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e65100" text-anchor="middle">Group 2</text>
  <rect x="170" y="100" width="60" height="22" rx="4" fill="#ffffff" stroke="#fb8c00" stroke-width="1" />
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="9" fill="#fb8c00" text-anchor="middle">WAL</text>

  <rect x="270" y="60" width="90" height="70" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1" />
  <text x="315" y="85" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">Group N</text>
  <rect x="285" y="100" width="60" height="22" rx="4" fill="#ffffff" stroke="#43a047" stroke-width="1" />
  <text x="315" y="115" font-family="Arial, sans-serif" font-size="9" fill="#43a047" text-anchor="middle">WAL</text>

  <!-- Disk icons (without) -->
  <ellipse cx="85" cy="170" rx="25" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <rect x="60" y="170" width="50" height="25" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <ellipse cx="85" cy="195" rx="25" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <text x="85" y="182" font-family="Arial, sans-serif" font-size="8" fill="#475569" text-anchor="middle">fsync</text>

  <ellipse cx="200" cy="170" rx="25" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <rect x="175" y="170" width="50" height="25" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <ellipse cx="200" cy="195" rx="25" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <text x="200" y="182" font-family="Arial, sans-serif" font-size="8" fill="#475569" text-anchor="middle">fsync</text>

  <ellipse cx="315" cy="170" rx="25" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <rect x="290" y="170" width="50" height="25" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <ellipse cx="315" cy="195" rx="25" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <text x="315" y="182" font-family="Arial, sans-serif" font-size="8" fill="#475569" text-anchor="middle">fsync</text>

  <!-- Lines from WAL to disk -->
  <line x1="85" y1="122" x2="85" y2="158" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2" />
  <line x1="200" y1="122" x2="200" y2="158" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2" />
  <line x1="315" y1="122" x2="315" y2="158" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2" />

  <text x="205" y="220" font-family="Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">N WAL files, N fsync operations</text>

  <!-- With Shared WAL Section -->
  <g filter="url(#shadow)">
    <rect x="410" y="20" width="370" height="210" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="595" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">With Shared WAL</text>
  </g>

  <!-- Group boxes (with shared WAL) -->
  <rect x="430" y="60" width="90" height="50" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" />
  <text x="475" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1565c0" text-anchor="middle">Group 1</text>

  <rect x="545" y="60" width="90" height="50" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1" />
  <text x="590" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e65100" text-anchor="middle">Group 2</text>

  <rect x="660" y="60" width="90" height="50" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1" />
  <text x="705" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">Group N</text>

  <!-- Converging lines -->
  <line x1="475" y1="110" x2="590" y2="135" stroke="#64748b" stroke-width="1.5" />
  <line x1="590" y1="110" x2="590" y2="135" stroke="#64748b" stroke-width="1.5" />
  <line x1="705" y1="110" x2="590" y2="135" stroke="#64748b" stroke-width="1.5" />

  <!-- Shared WAL box -->
  <rect x="530" y="140" width="120" height="35" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="590" y="163" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Shared WAL</text>

  <!-- Single disk icon -->
  <ellipse cx="590" cy="195" rx="35" ry="15" fill="#e2e8f0" stroke="#16a34a" stroke-width="1.5" />
  <rect x="555" y="195" width="70" height="30" fill="#e2e8f0" stroke="#16a34a" stroke-width="1.5" />
  <ellipse cx="590" cy="225" rx="35" ry="15" fill="#e2e8f0" stroke="#16a34a" stroke-width="1.5" />
  <text x="590" y="212" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">Batched fsync</text>

  <!-- Line from shared WAL to disk -->
  <line x1="590" y1="175" x2="590" y2="180" stroke="#16a34a" stroke-width="2" />

  <text x="595" y="220" font-family="Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle"></text>

  <!-- Comparison Section -->
  <g filter="url(#shadow)">
    <rect x="20" y="250" width="760" height="210" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="400" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">How Shared WAL Works</text>
  </g>

  <!-- Entry format -->
  <rect x="40" y="300" width="220" height="80" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" />
  <text x="150" y="325" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1565c0" text-anchor="middle">Entry Format</text>
  <text x="150" y="350" font-family="monospace" font-size="10" fill="#1976d2" text-anchor="middle">[GroupID | Term | Index | Data]</text>
  <text x="150" y="370" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Prefixed with group identifier</text>

  <!-- Batching -->
  <rect x="290" y="300" width="220" height="80" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1" />
  <text x="400" y="325" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e65100" text-anchor="middle">Write Batching</text>
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="10" fill="#fb8c00" text-anchor="middle">Multiple group entries</text>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="10" fill="#fb8c00" text-anchor="middle">in single disk write</text>

  <!-- Recovery -->
  <rect x="540" y="300" width="220" height="80" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1" />
  <text x="650" y="325" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="middle">Recovery</text>
  <text x="650" y="350" font-family="Arial, sans-serif" font-size="10" fill="#43a047" text-anchor="middle">Scan and filter by</text>
  <text x="650" y="370" font-family="Arial, sans-serif" font-size="10" fill="#43a047" text-anchor="middle">GroupID on restart</text>

  <!-- Benefits -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Benefits: Fewer file descriptors, batched disk I/O, reduced fsync overhead</text>

  <!-- Interface hint -->
  <text x="400" y="445" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Interface: MultiRaftWalManager (see ibabuza/multi_raft.go)</text>
</svg>
