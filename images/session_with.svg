<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420">
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
    <marker id="arrow-left-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#7f8c8d"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrow-left-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="650" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="325" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">With Sessions</text>

  <!-- Client box -->
  <rect x="40" y="60" width="100" height="40" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Client</text>

  <!-- Raft Cluster box -->
  <rect x="450" y="60" width="150" height="40" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="525" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Raft Cluster</text>

  <!-- Vertical lines -->
  <line x1="90" y1="100" x2="90" y2="400" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="525" y1="100" x2="525" y2="400" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Step 1: RegisterSession -->
  <line x1="95" y1="130" x2="515" y2="130" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="305" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">RegisterSession()</text>

  <!-- Step 2: SessionID response -->
  <line x1="515" y1="160" x2="95" y2="160" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow-left-gray)"/>
  <text x="305" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">SessionID: 42</text>

  <!-- Step 3: Propose with session -->
  <line x1="95" y1="200" x2="515" y2="200" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="305" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Propose(session=42, seq=1, "transfer $100")</text>

  <!-- Applied and cached label -->
  <rect x="540" y="210" width="100" height="25" rx="3" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="590" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e8449">✓ Applied, cached</text>

  <!-- Step 4: Network timeout -->
  <line x1="515" y1="260" x2="95" y2="260" stroke="#e74c3c" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="305" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">(network timeout)</text>
  <text x="140" y="275" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">?</text>

  <!-- Step 5: Retry with same session -->
  <line x1="95" y1="300" x2="515" y2="300" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="305" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Retry(session=42, seq=1, "transfer $100")</text>

  <!-- Duplicate detected - Success -->
  <rect x="540" y="310" width="100" height="35" rx="3" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="590" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e8449">✓ Duplicate</text>
  <text x="590" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e8449">detected!</text>

  <!-- Step 6: Cached result -->
  <line x1="515" y1="370" x2="95" y2="370" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-left-green)"/>
  <text x="305" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">Cached result (no reprocessing)</text>
</svg>
