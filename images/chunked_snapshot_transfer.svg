<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="leaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="followerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC971F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Leader Node Box -->
  <rect x="30" y="20" width="740" height="230" rx="10" fill="url(#leaderGrad)" stroke="#2E6DA4" stroke-width="2"/>
  <text x="400" y="50" text-anchor="middle" fill="white" font-size="18" font-weight="bold">Leader Node</text>

  <!-- Snapshot Box -->
  <rect x="60" y="70" width="680" height="100" rx="5" fill="white" stroke="#2E6DA4" stroke-width="1"/>
  <text x="400" y="95" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Snapshot (100MB)</text>

  <!-- Chunks -->
  <rect x="80" y="110" width="100" height="45" rx="3" fill="url(#chunkGrad)" stroke="#C77C10" stroke-width="1"/>
  <text x="130" y="137" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Chunk 1</text>
  <text x="130" y="150" text-anchor="middle" fill="white" font-size="10">1MB</text>

  <rect x="195" y="110" width="100" height="45" rx="3" fill="url(#chunkGrad)" stroke="#C77C10" stroke-width="1"/>
  <text x="245" y="137" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Chunk 2</text>
  <text x="245" y="150" text-anchor="middle" fill="white" font-size="10">1MB</text>

  <rect x="310" y="110" width="100" height="45" rx="3" fill="url(#chunkGrad)" stroke="#C77C10" stroke-width="1"/>
  <text x="360" y="137" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Chunk 3</text>
  <text x="360" y="150" text-anchor="middle" fill="white" font-size="10">1MB</text>

  <rect x="425" y="110" width="100" height="45" rx="3" fill="url(#chunkGrad)" stroke="#C77C10" stroke-width="1"/>
  <text x="475" y="137" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Chunk 4</text>
  <text x="475" y="150" text-anchor="middle" fill="white" font-size="10">1MB</text>

  <text x="555" y="137" text-anchor="middle" fill="#666" font-size="20">...</text>

  <rect x="595" y="110" width="120" height="45" rx="3" fill="url(#chunkGrad)" stroke="#C77C10" stroke-width="1"/>
  <text x="655" y="137" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Chunk N</text>

  <!-- Network Box -->
  <rect x="60" y="190" width="680" height="40" rx="5" fill="#D9EDF7" stroke="#BCE8F1" stroke-width="1"/>
  <text x="400" y="215" text-anchor="middle" fill="#31708F" font-size="14" font-weight="bold">Network (with Rate Limiting)</text>

  <!-- Arrows from chunks to network -->
  <line x1="130" y1="155" x2="130" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="245" y1="155" x2="245" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="155" x2="360" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="475" y1="155" x2="475" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrow from leader to follower -->
  <line x1="400" y1="250" x2="400" y2="290" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Follower Node Box -->
  <rect x="30" y="310" width="740" height="270" rx="10" fill="url(#followerGrad)" stroke="#3C763D" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" fill="white" font-size="18" font-weight="bold">Follower Node</text>

  <!-- AtomicSnapshotReceiver Box -->
  <rect x="60" y="360" width="680" height="140" rx="5" fill="white" stroke="#3C763D" stroke-width="1"/>
  <text x="400" y="385" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">AtomicSnapshotReceiver</text>

  <!-- Received Chunks -->
  <rect x="80" y="400" width="100" height="45" rx="3" fill="#DFF0D8" stroke="#3C763D" stroke-width="1"/>
  <text x="130" y="422" text-anchor="middle" fill="#3C763D" font-size="12" font-weight="bold">Chunk 1</text>
  <circle cx="155" cy="435" r="8" fill="#5CB85C"/>
  <text x="155" y="439" text-anchor="middle" fill="white" font-size="10" font-weight="bold">&#10003;</text>

  <rect x="195" y="400" width="100" height="45" rx="3" fill="#DFF0D8" stroke="#3C763D" stroke-width="1"/>
  <text x="245" y="422" text-anchor="middle" fill="#3C763D" font-size="12" font-weight="bold">Chunk 2</text>
  <circle cx="270" cy="435" r="8" fill="#5CB85C"/>
  <text x="270" y="439" text-anchor="middle" fill="white" font-size="10" font-weight="bold">&#10003;</text>

  <rect x="310" y="400" width="100" height="45" rx="3" fill="#DFF0D8" stroke="#3C763D" stroke-width="1"/>
  <text x="360" y="422" text-anchor="middle" fill="#3C763D" font-size="12" font-weight="bold">Chunk 3</text>
  <circle cx="385" cy="435" r="8" fill="#5CB85C"/>
  <text x="385" y="439" text-anchor="middle" fill="white" font-size="10" font-weight="bold">&#10003;</text>

  <text x="455" y="425" text-anchor="middle" fill="#666" font-size="20">...</text>

  <rect x="510" y="400" width="100" height="45" rx="3" fill="#FCF8E3" stroke="#8A6D3B" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="560" y="422" text-anchor="middle" fill="#8A6D3B" font-size="12" font-weight="bold">(receiving)</text>

  <!-- Commit message -->
  <rect x="80" y="460" width="660" height="30" rx="3" fill="#F5F5F5" stroke="#CCC" stroke-width="1"/>
  <text x="400" y="480" text-anchor="middle" fill="#333" font-size="13">On complete: <tspan font-weight="bold">Commit()</tspan> &#8594; Atomic install</text>

  <!-- CRC32 Validation Label -->
  <rect x="620" y="395" width="110" height="55" rx="5" fill="#E7F3FF" stroke="#0066CC" stroke-width="1"/>
  <text x="675" y="418" text-anchor="middle" fill="#0066CC" font-size="11" font-weight="bold">CRC32</text>
  <text x="675" y="435" text-anchor="middle" fill="#0066CC" font-size="11">Validation</text>
</svg>
