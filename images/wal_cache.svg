<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <!-- Container -->
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2" />
  <rect x="20" y="20" width="760" height="40" rx="12" fill="#334155" />
  <rect x="20" y="40" width="760" height="20" fill="#334155" />
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">EntryStorage Architecture</text>

  <!-- Entry Index Box -->
  <g filter="url(#shadow)">
    <rect x="60" y="90" width="310" height="120" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5" />
    <text x="215" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004d40" text-anchor="middle">Entry Index[]</text>
    <text x="215" y="150" font-family="Arial, sans-serif" font-size="13" fill="#00695c" text-anchor="middle">(Term, Index, Type, Meta)</text>
    <text x="215" y="180" font-family="Arial, sans-serif" font-size="12" fill="#00796b" text-anchor="middle" font-style="italic">Fast Lookup Table</text>
  </g>

  <!-- Ring Buffer Box -->
  <g filter="url(#shadow)">
    <rect x="430" y="90" width="310" height="120" rx="8" fill="#fff9c4" stroke="#fbc02d" stroke-width="1.5" />
    <text x="585" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#827717" text-anchor="middle">Ring Buffer Cache</text>
    <text x="585" y="150" font-family="Arial, sans-serif" font-size="13" fill="#9a8406" text-anchor="middle">(Recent Entry Data)</text>
    <text x="585" y="180" font-family="Arial, sans-serif" font-size="12" fill="#9a8406" text-anchor="middle" font-style="italic">In-Memory Hot Data</text>
  </g>

  <!-- Logic Connectors -->
  <path d="M215 210 L215 260 L380 260" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M585 210 L585 260 L420 260" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <rect x="360" y="245" width="80" height="30" rx="15" fill="#f1f5f9" stroke="#64748b" />
  <text x="400" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">HIT?</text>

  <!-- WAL Reader Box -->
  <g filter="url(#shadow)">
    <path d="M400 275 L400 310" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
    <text x="415" y="300" font-family="Arial, sans-serif" font-size="12" fill="#ef4444" font-weight="bold">Cache Miss</text>
    
    <rect x="250" y="320" width="300" height="80" rx="8" fill="#ffecb3" stroke="#ffa000" stroke-width="1.5" />
    <text x="400" y="355" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff6f00" text-anchor="middle">WAL Reader</text>
    <text x="400" y="380" font-family="Arial, sans-serif" font-size="12" fill="#e65100" text-anchor="middle">Disk I/O Access (Storage Engine)</text>
  </g>
</svg>