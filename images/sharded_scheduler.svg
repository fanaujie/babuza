<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Sharded Scheduler Architecture</text>

  <!-- Raft Groups Container -->
  <g filter="url(#shadow)">
    <rect x="40" y="50" width="720" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <text x="70" y="75" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569">Raft Groups</text>
  </g>

  <!-- Raft Group boxes -->
  <rect x="60" y="85" width="40" height="25" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" />
  <text x="80" y="102" font-family="Arial, sans-serif" font-size="10" fill="#1565c0" text-anchor="middle">1</text>

  <rect x="110" y="85" width="40" height="25" rx="4" fill="#fff3e0" stroke="#fb8c00" stroke-width="1" />
  <text x="130" y="102" font-family="Arial, sans-serif" font-size="10" fill="#e65100" text-anchor="middle">2</text>

  <rect x="160" y="85" width="40" height="25" rx="4" fill="#e8f5e9" stroke="#43a047" stroke-width="1" />
  <text x="180" y="102" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">3</text>

  <rect x="210" y="85" width="40" height="25" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" />
  <text x="230" y="102" font-family="Arial, sans-serif" font-size="10" fill="#1565c0" text-anchor="middle">4</text>

  <rect x="260" y="85" width="40" height="25" rx="4" fill="#fff3e0" stroke="#fb8c00" stroke-width="1" />
  <text x="280" y="102" font-family="Arial, sans-serif" font-size="10" fill="#e65100" text-anchor="middle">5</text>

  <rect x="310" y="85" width="40" height="25" rx="4" fill="#e8f5e9" stroke="#43a047" stroke-width="1" />
  <text x="330" y="102" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">6</text>

  <rect x="360" y="85" width="40" height="25" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" />
  <text x="380" y="102" font-family="Arial, sans-serif" font-size="10" fill="#1565c0" text-anchor="middle">7</text>

  <rect x="410" y="85" width="40" height="25" rx="4" fill="#fff3e0" stroke="#fb8c00" stroke-width="1" />
  <text x="430" y="102" font-family="Arial, sans-serif" font-size="10" fill="#e65100" text-anchor="middle">8</text>

  <rect x="460" y="85" width="40" height="25" rx="4" fill="#e8f5e9" stroke="#43a047" stroke-width="1" />
  <text x="480" y="102" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">9</text>

  <rect x="510" y="85" width="40" height="25" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" />
  <text x="530" y="102" font-family="Arial, sans-serif" font-size="10" fill="#1565c0" text-anchor="middle">10</text>

  <rect x="560" y="85" width="40" height="25" rx="4" fill="#fff3e0" stroke="#fb8c00" stroke-width="1" />
  <text x="580" y="102" font-family="Arial, sans-serif" font-size="10" fill="#e65100" text-anchor="middle">11</text>

  <rect x="610" y="85" width="40" height="25" rx="4" fill="#e8f5e9" stroke="#43a047" stroke-width="1" />
  <text x="630" y="102" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">12</text>

  <text x="680" y="102" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">...</text>

  <!-- Distribution arrows -->
  <text x="400" y="145" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">groupID % shardNum</text>
  <line x1="150" y1="155" x2="150" y2="175" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="400" y1="155" x2="400" y2="175" stroke="#fb8c00" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="650" y1="155" x2="650" y2="175" stroke="#43a047" stroke-width="1.5" marker-end="url(#arrowhead)" />

  <!-- Shard 0 -->
