services:
  # UI Service
  kvstore-ui:
    image: nginx:alpine
    container_name: kvstore-ui
    volumes:
      - ../ui:/usr/share/nginx/html
    ports:
      - "8080:80"
    depends_on:
      - kvstore-node1
      - kvstore-node2
      - kvstore-node3

  # Node 1
  kvstore-node1:
    image: babuza-kvstore:latest
    container_name: kvstore-node1
    command: [
      "server",
      "--raft-cluster-id=100",
      "--raft-local-peer-id=1",
      "--raft-local-peer-address=kvstore-node1:14200",
      "--kv-http-address=kvstore-node1:24200",
      "--raft-storage-dir=/data/raft_storage",
      "--raft-cluster-peers-address=1=kvstore-node1:14200,2=kvstore-node2:14200,3=kvstore-node3:14200",
      "--transport-protocol=tcp",
      "--wal-type=babuza-wal",
      "--snapshot-type=durable",
      "--state-machine=memory"
    ]
    ports:
      - "24201:24200"  # HTTP API

  # Node 2
  kvstore-node2:
    image: babuza-kvstore:latest
    container_name: kvstore-node2
    command: [
      "server",
      "--raft-cluster-id=100",
      "--raft-local-peer-id=2",
      "--raft-local-peer-address=kvstore-node2:14200",
      "--kv-http-address=kvstore-node2:24200",
      "--raft-storage-dir=/data/raft_storage",
      "--raft-cluster-peers-address=1=kvstore-node1:14200,2=kvstore-node2:14200,3=kvstore-node3:14200",
      "--transport-protocol=tcp",
      "--wal-type=babuza-wal",
      "--snapshot-type=durable",
      "--state-machine=memory"
    ]
    ports:
      - "24202:24200"  # HTTP API


  # Node 3
  kvstore-node3:
    image: babuza-kvstore:latest
    container_name: kvstore-node3
    command: [
      "server",
      "--raft-cluster-id=100",
      "--raft-local-peer-id=3",
      "--raft-local-peer-address=kvstore-node3:14200",
      "--kv-http-address=kvstore-node3:24200",
      "--raft-storage-dir=/data/raft_storage",
      "--raft-cluster-peers-address=1=kvstore-node1:14200,2=kvstore-node2:14200,3=kvstore-node3:14200",
      "--transport-protocol=tcp",
      "--wal-type=babuza-wal",
      "--snapshot-type=durable",
      "--state-machine=memory"
    ]
    ports:
      - "24203:24200"  # HTTP API

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    depends_on:
      - kvstore-node1
      - kvstore-node2
      - kvstore-node3
    restart: unless-stopped

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
